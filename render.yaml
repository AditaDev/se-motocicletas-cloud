services:
  - type: web
    name: experto-motocicletas-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m datos.preparacion && gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: '4000'
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      - key: MYSQL_SSL
        value: '1'
